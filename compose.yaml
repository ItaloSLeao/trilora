name: trilora-intelligence
x-backend: &backend
  build: {context: ., dockerfile: backend/Dockerfile}
  environment:
    DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD alfanumerica}@db/atlas
    OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    EMBED_MODEL: ${EMBED_MODEL:-qwen2.5:3b}
    CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:3b}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  extra_hosts: ["host.docker.internal:host-gateway"]
  depends_on:
    migrate: {condition: service_completed_successfully}
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${ATLAS_DB_PORT:-55432}:5432"]
    volumes: [atlas_ai:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    <<: *backend
    depends_on: {db: {condition: service_healthy}}
    command: ["python","-m","backend.db","migrate"]
  api:
    <<: *backend
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  index:
    <<: *backend
    command: ["python","-m","backend.worker","index"]
  monitor:
    <<: *backend
    command: ["python","-m","backend.worker","monitor"]
volumes:
  atlas_ai:
